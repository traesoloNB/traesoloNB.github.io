<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 迪恩认证流程管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            color: #1a365d;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: #718096;
            font-size: 0.95rem;
        }
        
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #f7fafc;
            padding: 5px;
            border-radius: 10px;
        }
        
        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #4a5568;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .auth-tab.active {
            background: white;
            color: #1a365d;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }
        
        .form-group input.error {
            border-color: #e53e3e;
        }
        
        .error-message {
            color: #e53e3e;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3182ce, #2c5282);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(49, 130, 206, 0.3);
        }
        
        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .back-link:hover {
            color: #3182ce;
        }
        
        .admin-notice {
            background: #fffaf0;
            border-left: 4px solid #ed8936;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #744210;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🔐 认证流程管理系统</h1>
            <p>迪恩认证 - 专业卫浴产品认证服务</p>
        </div>
        
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">登录</button>
            <button class="auth-tab" onclick="switchTab('register')">注册</button>
        </div>
        
        <!-- 登录表单 -->
        <form class="auth-form active" id="loginForm">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="loginEmail" placeholder="请输入邮箱" required>
                <div class="error-message" id="loginEmailError"></div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" required>
                <div class="error-message" id="loginPasswordError"></div>
            </div>
            <button type="submit" class="auth-btn" id="loginBtn">登录</button>
        </form>
        
        <!-- 注册表单 -->
        <form class="auth-form" id="registerForm">
            <div class="admin-notice">
                💡 第一个注册的用户将自动成为管理员
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="registerName" placeholder="请输入您的姓名" required>
                <div class="error-message" id="registerNameError"></div>
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="registerEmail" placeholder="请输入邮箱" required>
                <div class="error-message" id="registerEmailError"></div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="registerPassword" placeholder="至少6位密码" required>
                <div class="error-message" id="registerPasswordError"></div>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="registerConfirm" placeholder="再次输入密码" required>
                <div class="error-message" id="registerConfirmError"></div>
            </div>
            <button type="submit" class="auth-btn" id="registerBtn">注册</button>
        </form>
        
        <a href="index.html" class="back-link">← 返回首页</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        // Firebase配置
        const firebaseConfig = {
            apiKey: "AIzaSyBnBZvO866eyjQXMjbE53piCQ42m2BufQ4",
            authDomain: "dien-certification.firebaseapp.com",
            projectId: "dien-certification",
            storageBucket: "dien-certification.firebasestorage.app",
            messagingSenderId: "236272140746",
            appId: "1:236272140746:web:126b0c05fefbecf1e88f33"
        };
        
        // 初始化Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // 检查是否已登录
        auth.onAuthStateChanged(function(user) {
            if (user) {
                // 已登录，跳转到流程选择页面
                window.location.href = 'dashboard.html';
            }
        });
        
        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(function(t) {
                t.classList.remove('active');
            });
            document.querySelectorAll('.auth-form').forEach(function(f) {
                f.classList.remove('active');
            });
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }
        
        // 显示错误信息
        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            const inputEl = document.getElementById(elementId.replace('Error', ''));
            errorEl.textContent = message;
            errorEl.classList.add('show');
            if (inputEl) inputEl.classList.add('error');
        }
        
        // 清除错误信息
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(function(el) {
                el.classList.remove('show');
            });
            document.querySelectorAll('input').forEach(function(el) {
                el.classList.remove('error');
            });
        }
        
        // 设置按钮加载状态
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span>处理中...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btnId === 'loginBtn' ? '登录' : '注册';
            }
        }
        
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email) {
                showError('loginEmailError', '请输入邮箱');
                return;
            }
            if (!password) {
                showError('loginPasswordError', '请输入密码');
                return;
            }
            
            setLoading('loginBtn', true);
            
            auth.signInWithEmailAndPassword(email, password)
                .then(function() {
                    window.location.href = 'dashboard.html';
                })
                .catch(function(error) {
                    setLoading('loginBtn', false);
                    if (error.code === 'auth/user-not-found') {
                        showError('loginEmailError', '用户不存在');
                    } else if (error.code === 'auth/wrong-password') {
                        showError('loginPasswordError', '密码错误');
                    } else {
                        showError('loginEmailError', '登录失败：' + error.message);
                    }
                });
        });
        
        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;
            
            let hasError = false;
            
            if (!name) {
                showError('registerNameError', '请输入姓名');
                hasError = true;
            }
            if (!email) {
                showError('registerEmailError', '请输入邮箱');
                hasError = true;
            }
            if (password.length < 6) {
                showError('registerPasswordError', '密码至少6位');
                hasError = true;
            }
            if (password !== confirm) {
                showError('registerConfirmError', '两次密码不一致');
                hasError = true;
            }
            
            if (hasError) return;
            
            setLoading('registerBtn', true);
            
            // 先检查是否已有用户
            db.collection('users').get().then(function(snapshot) {
                const isFirstUser = snapshot.empty;
                
                auth.createUserWithEmailAndPassword(email, password)
                    .then(function(userCredential) {
                        const user = userCredential.user;
                        
                        // 保存用户信息到数据库
                        return db.collection('users').doc(user.uid).set({
                            name: name,
                            email: email,
                            role: isFirstUser ? 'admin' : 'user',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    })
                    .then(function() {
                        window.location.href = 'dashboard.html';
                    })
                    .catch(function(error) {
                        setLoading('registerBtn', false);
                        if (error.code === 'auth/email-already-in-use') {
                            showError('registerEmailError', '该邮箱已被注册');
                        } else {
                            showError('registerEmailError', '注册失败：' + error.message);
                        }
                    });
            });
        });
    </script>
</body>
</html>
