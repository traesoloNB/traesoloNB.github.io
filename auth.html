<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 迪恩认证流程管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            color: #1a365d;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: #718096;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }
        
        .form-group input.error {
            border-color: #e53e3e;
        }
        
        .error-message {
            color: #e53e3e;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3182ce, #2c5282);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(49, 130, 206, 0.3);
        }
        
        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .back-link:hover {
            color: #3182ce;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🔐 认证流程管理系统</h1>
            <p>迪恩认证 - 专业卫浴产品认证服务</p>
        </div>
        
        <!-- 登录表单 -->
        <form class="auth-form active" id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名" required>
                <div class="error-message" id="loginUsernameError"></div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" required>
                <div class="error-message" id="loginPasswordError"></div>
            </div>
            <button type="submit" class="auth-btn" id="loginBtn">登录</button>
        </form>
        
        <a href="index.html" class="back-link">← 返回首页</a>
    </div>

    <script>
        // 用户数据库
        const USERS = [
            { username: 'dien1', password: '123456', role: 'admin', name: '管理员' },
            { username: 'dien2', password: '123456', role: 'user', name: '员工2' },
            { username: 'dien3', password: '123456', role: 'user', name: '员工3' },
            { username: 'dien4', password: '123456', role: 'user', name: '员工4' },
            { username: 'dien5', password: '123456', role: 'user', name: '员工5' },
            { username: 'dien6', password: '123456', role: 'user', name: '员工6' },
            { username: 'dien7', password: '123456', role: 'user', name: '员工7' },
            { username: 'dien8', password: '123456', role: 'user', name: '员工8' },
            { username: 'dien9', password: '123456', role: 'user', name: '员工9' },
            { username: 'dien10', password: '123456', role: 'user', name: '员工10' }
        ];

        // 检查是否已登录
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            window.location.href = 'dashboard.html';
        }
        
        // 显示错误信息
        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            const inputEl = document.getElementById(elementId.replace('Error', ''));
            errorEl.textContent = message;
            errorEl.classList.add('show');
            if (inputEl) inputEl.classList.add('error');
        }
        
        // 清除错误信息
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(function(el) {
                el.classList.remove('show');
            });
            document.querySelectorAll('input').forEach(function(el) {
                el.classList.remove('error');
            });
        }
        
        // 设置按钮加载状态
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span>处理中...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '登录';
            }
        }
        
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username) {
                showError('loginUsernameError', '请输入用户名');
                return;
            }
            if (!password) {
                showError('loginPasswordError', '请输入密码');
                return;
            }
            
            setLoading('loginBtn', true);
            
            // 模拟网络延迟
            setTimeout(function() {
                const user = USERS.find(function(u) {
                    return u.username === username && u.password === password;
                });
                
                if (user) {
                    // 登录成功，保存用户信息到localStorage
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    window.location.href = 'dashboard.html';
                } else {
                    setLoading('loginBtn', false);
                    // 检查是用户名错误还是密码错误
                    const userExists = USERS.find(function(u) {
                        return u.username === username;
                    });
                    if (userExists) {
                        showError('loginPasswordError', '密码错误');
                    } else {
                        showError('loginUsernameError', '用户名不存在');
                    }
                }
            }, 500);
        });
    </script>
</body>
</html>
